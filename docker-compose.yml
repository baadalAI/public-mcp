services:
  computeedge:
    build: .
    ports:
      - "8080:8080"
    environment:
      COMPUTEEDGE_TRANSPORT: sse
      COMPUTEEDGE_DB_PATH: /data/computeedge.db
      COMPUTEEDGE_ALLOWED_HOSTS: "${COMPUTEEDGE_ALLOWED_HOSTS:-localhost:8080,0.0.0.0:8080}"
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8080"
    volumes:
      - computeedge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/sse')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  computeedge-data:
