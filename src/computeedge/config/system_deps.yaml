# Maps Python packages to their required system (apt) dependencies.
# Used by AnalysisService to pre-install system packages in Dockerfiles.
python_packages:
  psycopg2: ["libpq-dev"]
  psycopg2-binary: []
  mysqlclient: ["default-libmysqlclient-dev"]
  Pillow: ["libjpeg-dev", "zlib1g-dev"]
  lxml: ["libxml2-dev", "libxslt1-dev"]
  cryptography: ["libffi-dev", "libssl-dev"]
  pycairo: ["libcairo2-dev", "pkg-config"]
  pygraphviz: ["graphviz", "graphviz-dev"]
  python-ldap: ["libldap2-dev", "libsasl2-dev"]
  xmlsec: ["xmlsec1", "libxmlsec1-dev"]
  cffi: ["libffi-dev"]
  bcrypt: ["libffi-dev"]
  numpy: []
  pandas: []
  scipy: ["gfortran", "libopenblas-dev"]
  greenlet: []
  gevent: ["libevent-dev"]
  uvloop: []
  grpcio: []
  psutil: []
  PyYAML: ["libyaml-dev"]
  confluent-kafka: ["librdkafka-dev"]
  python-snappy: ["libsnappy-dev"]
  zstandard: ["libzstd-dev"]
  h5py: ["libhdf5-dev"]
  opencv-python: ["libgl1-mesa-glx", "libglib2.0-0"]
  opencv-python-headless: []
  pyarrow: []
  dlib: ["cmake", "libopenblas-dev", "liblapack-dev"]
  face-recognition: ["cmake", "libopenblas-dev", "liblapack-dev"]

# Always included when any system deps are needed (compiler + pkg-config)
python_base_build_packages: ["gcc", "pkg-config"]
